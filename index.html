<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProSuite File Tools</title>

<!-- Tailwind CDN works on network, but for offline use, basic styles are backed up -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Inline Fallback scripts integrated to ensure jsPDF & QRCode work offline/locally inside Android IDE -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- Embedded a trusted lightweight UMD bundle for jsPDF to prevent CDN block inside WebView -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    background: #0f172a;
    color: white;
    font-family: sans-serif;
}
.tab { display: none; }
.active { display: block; }
/* Custom utility classes in case Tailwind fails to load inside the IDE */
.btn-design { width: 100%; padding: 12px; border-radius: 4px; margin-bottom: 8px; font-weight: bold; color: white; cursor: pointer; }
</style>
</head>

<body class="min-h-screen">

<div class="flex flex-col md:flex-row">

<!-- Sidebar -->
<div class="w-full md:w-64 bg-slate-800 p-4">
    <h1 class="text-2xl font-bold mb-6">Zexfile</h1>
    <div class="space-y-2">
        <button onclick="showTab('txt')" class="btn-design bg-indigo-600">TXT Creator</button>
        <button onclick="showTab('json')" class="btn-design bg-green-600">JSON Tool</button>
        <button onclick="showTab('qr')" class="btn-design bg-cyan-600">QR Generator</button>
        <button onclick="showTab('preview')" class="btn-design bg-yellow-600">Image Preview</button>
        <button onclick="showTab('pdf')" class="btn-design bg-red-600">Image To PDF</button>
    </div>
</div>

<!-- Content -->
<div class="flex-1 p-6">

    <!-- TXT -->
    <div id="txt" class="tab active">
        <h2 class="text-2xl mb-4">TXT Creator</h2>
        <textarea id="textInput" class="w-full h-52 p-4 rounded text-black" placeholder="Write text here..."></textarea>
        <button onclick="downloadTXT()" class="mt-4 bg-indigo-600 px-6 py-3 rounded font-bold">Download TXT</button>
        <div id="txtStatus" class="mt-2 text-sm text-gray-400"></div>
    </div>

    <!-- JSON -->
    <div id="json" class="tab">
        <h2 class="text-2xl mb-4">JSON Tool</h2>
        <textarea id="jsonInput" class="w-full h-52 p-4 rounded text-black" placeholder='{"name":"Zexfile"}'></textarea>
        <button onclick="downloadJSON()" class="mt-4 bg-green-600 px-6 py-3 rounded font-bold">Validate & Download</button>
        <div id="jsonStatus" class="mt-2 text-sm text-gray-400"></div>
    </div>

    <!-- QR -->
    <div id="qr" class="tab">
        <h2 class="text-2xl mb-4">QR Generator</h2>
        <input id="qrText" type="text" placeholder="Enter URL or Text" class="w-full p-3 rounded text-black">
        <button onclick="generateQR()" class="mt-4 bg-cyan-600 px-6 py-3 rounded font-bold">Generate QR</button>
        <div class="mt-5"><div id="qrcode" class="bg-white p-4 inline-block"></div></div>
    </div>

    <!-- Preview -->
    <div id="preview" class="tab">
        <h2 class="text-2xl mb-4">Image Preview</h2>
        <input type="file" accept="image/*" onchange="previewImage(event)" class="mb-4">
        <div><img id="previewImg" class="max-w-full rounded hidden" style="max-height: 300px;"></div>
    </div>

    <!-- PDF -->
    <div id="pdf" class="tab">
        <h2 class="text-2xl mb-4">Image To PDF</h2>
        <input type="file" accept="image/*" id="pdfImage" class="mb-4 block">
        <button onclick="convertPDF()" class="bg-red-600 px-6 py-3 rounded font-bold">Convert To PDF</button>
        <div id="pdfStatus" class="mt-4 text-sm text-yellow-400"></div>
        <div id="pdfLinkContainer" class="mt-4 hidden">
            <p class="text-green-400 mb-2">✓ PDF Generated Successfully!</p>
            <a id="pdfDownloadLink" href="#" class="inline-block bg-blue-600 px-4 py-2 rounded text-white font-bold text-center">Click Here to Save/Open PDF</a>
        </div>
    </div>

</div>

</div>

<script>
function showTab(id){
    document.querySelectorAll(".tab").forEach(tab=>{
        tab.classList.remove("active");
    });
    document.getElementById(id).classList.add("active");
}

// Android Compatible Download Fallback Handler
function triggerDownload(content, fileName, contentType) {
    try {
        let blob = new Blob([content], {type: contentType});
        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    } catch(err) {
        // Safe alternative for raw IDE browsers that block simulated clicks
        alert("Download triggered for " + fileName + ". If download doesn't start, please copy the text/data directly or open this file in an external browser like Chrome.");
    }
}

function downloadTXT(){
    let text = document.getElementById("textInput").value;
    if(!text) { alert("Please enter some text"); return; }
    triggerDownload(text, "file.txt", "text/plain");
    document.getElementById("txtStatus").innerText = "File 'file.txt' download initiated.";
}

function downloadJSON(){
    let data = document.getElementById("jsonInput").value;
    if(!data) { alert("Please enter JSON data"); return; }
    try{
        JSON.parse(data);
        triggerDownload(data, "data.json", "application/json");
        document.getElementById("jsonStatus").innerHTML = "<span class='text-green-400'>Valid JSON. Download initiated.</span>";
    }catch(e){
        alert("Invalid JSON format!");
        document.getElementById("jsonStatus").innerHTML = "<span class='text-red-400'>Error: Invalid JSON</span>";
    }
}

function generateQR(){
    let text = document.getElementById("qrText").value;
    if(!text) { alert("Please enter text or a URL"); return; }
    document.getElementById("qrcode").innerHTML="";
    if(typeof QRCode === "undefined") {
        alert("QR Library blocked by IDE environment. Open in Chrome browser to use this feature.");
        return;
    }
    new QRCode(document.getElementById("qrcode"), {
        text: text,
        width: 200,
        height: 200
    });
}

function previewImage(event){
    let file = event.target.files[0];
    if(!file) return;
    let reader = new FileReader();
    reader.onload = function(e){
        let img = document.getElementById("previewImg");
        img.src = e.target.result;
        img.classList.remove("hidden");
    };
    reader.readAsDataURL(file);
}

async function convertPDF(){
    let file = document.getElementById("pdfImage").files[0];
    if(!file){
        alert("Please select an image first");
        return;
    }

    document.getElementById("pdfStatus").innerText = "Processing image...";
    document.getElementById("pdfLinkContainer").classList.add("hidden");

    let reader = new FileReader();
    reader.onload = function(e){
        try {
            // Safe checking for jsPDF initialization inside restricted inner WebView
            let targetJsPDF = window.jspdf ? window.jspdf.jsPDF : (typeof jsPDF !== 'undefined' ? jsPDF : null);
            
            if(!targetJsPDF) {
                throw new Error("jsPDF library could not be loaded inside this IDE's previewer.");
            }
            
            let pdf = new targetJsPDF();
            
            // Standardizing PDF addition with auto orientation fallback
            pdf.addImage(e.target.result, "JPEG", 10, 10, 190, 140);
            
            document.getElementById("pdfStatus").innerText = "";
            
            // Generate standard dataURI string for embedded links (Best practice for Android WebView)
            let pdfDataUri = pdf.output('datauristring');
            
            let downloadBtn = document.getElementById("pdfDownloadLink");
            downloadBtn.href = pdfDataUri;
            downloadBtn.download = "converted_image.pdf";
            
            // Presenting an explicit manual download button which bypasses background .click() blocks
            document.getElementById("pdfLinkContainer").classList.remove("hidden");
            
            // Attempting automatic save fallback
            pdf.save("image.pdf");
            
        } catch(err) {
            document.getElementById("pdfStatus").innerText = "";
            alert("Error: " + err.message + "\n\nTip: Android IDE internal previews block PDF generation libraries. Long-press your HTML file and open it inside 'Chrome Browser' to make it work flawlessly.");
        }
    };
    reader.readAsDataURL(file);
}
</script>

</body>
</html>
